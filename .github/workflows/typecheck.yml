name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "public-readiness/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: TypeScript and safety hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck the workspace
        run: pnpm typecheck
      - name: Run deterministic hook harness
        run: pnpm dfc:validate-hooks

  studio-gui:
    name: Daemon and Chromium GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Exercise the real Studio daemon and GUI
        run: bash scripts/ci-studio-gui.sh
      - name: Upload GUI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-gui-evidence
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  tauri:
    name: Tauri shell
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: studio-tauri/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio-tauri/src-tauri -> target
      - name: Install Tauri CLI dependencies
        working-directory: studio-tauri
        run: pnpm install --frozen-lockfile
      - name: Run Rust tests
        run: cargo test --manifest-path studio-tauri/src-tauri/Cargo.toml
      - name: Build the native shell
        working-directory: studio-tauri
        run: pnpm tauri build --debug --no-bundle
